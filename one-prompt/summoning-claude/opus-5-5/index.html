<canvas id="view" tabindex="0" aria-label="An animated summoning: a party calls forth Claude, a radiant spark, to defeat a Spaghetti Hydra. Click or press Enter to begin; sound on."></canvas>
<script>
(function () {
'use strict';

/* ============================================================
   UTILITIES
   ============================================================ */
const PI = Math.PI, TAU = Math.PI * 2;
const sat = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const sstep = (a, b, x) => smooth(sat((x - a) / (b - a)));
const prog = (t, a, b) => sat((t - a) / (b - a));
const eOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const eIn = t => t * t * t;
const eIO = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = t => { const s = 1.9, u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; };
const eExpo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const win = (t, a, b, c, d) => sstep(a, b, t) * (1 - sstep(c, d, t));
function hash(n) {
  n |= 0;
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
const R = (i, k) => hash(i * 374761393 + (k || 0) * 668265263 + 1013904223);
function n1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return (R(i, 77) * (1 - u) + R(i + 1, 77) * u) * 2 - 1; }
const pos = v => (v > 0 ? v : 0);

const SERIF = '"Cinzel","Trajan Pro","Palatino Linotype","Book Antiqua",Palatino,"Hoefler Text",Georgia,serif';
const SANS = '"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif';
const MONO = '"Cascadia Code","SF Mono",Consolas,Menlo,"Courier New",monospace';

/* ============================================================
   CANVAS + SPRITES
   ============================================================ */
const VW = 1600, VH = 900;
const cv = document.getElementById('view');
const ctx = cv.getContext('2d', { alpha: false });
let W = 2, H = 2, S = 1, PR = 1, pixBudget = 2.3e6;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function mkLayer() { const c = mkCanvas(2, 2); return { c, x: c.getContext('2d') }; }
const BL = [mkLayer(), mkLayer(), mkLayer(), mkLayer()];
const TMP = mkLayer();
let VIG = mkLayer();

function glowSprite(r, g, b, size, fall) {
  size = size || 128; fall = fall || 2.2;
  const c = mkCanvas(size, size), x = c.getContext('2d'), h = size / 2;
  const gr = x.createRadialGradient(h, h, 0, h, h, h);
  for (let i = 0; i <= 10; i++) {
    const u = i / 10, a = Math.pow(1 - u, fall);
    gr.addColorStop(u, 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(4) + ')');
  }
  x.fillStyle = gr; x.fillRect(0, 0, size, size);
  return c;
}
const SPR = {
  white: glowSprite(255, 255, 255),
  gold: glowSprite(255, 204, 138),
  orange: glowSprite(229, 120, 80),
  ember: glowSprite(255, 150, 70),
  green: glowSprite(110, 255, 160),
  magenta: glowSprite(255, 60, 130),
  violet: glowSprite(170, 140, 255),
  hot: glowSprite(255, 242, 222, 128, 1.3),
  smoke: glowSprite(46, 26, 22, 128, 1.2),
};
SPR.disc = (function () {
  const c = mkCanvas(64, 64), x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.55, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c;
})();
SPR.flare = (function () {
  const s = 256, c = mkCanvas(s, s), x = c.getContext('2d');
  x.globalCompositeOperation = 'lighter';
  for (const rot of [0, PI / 2, PI / 4, -PI / 4]) {
    const big = Math.abs(rot) < 0.1 || Math.abs(rot - PI / 2) < 0.1;
    x.save(); x.translate(s / 2, s / 2); x.rotate(rot);
    const g = x.createLinearGradient(-s / 2, 0, s / 2, 0);
    g.addColorStop(0, 'rgba(255,220,180,0)'); g.addColorStop(0.5, big ? 'rgba(255,248,236,1)' : 'rgba(255,230,200,0.45)'); g.addColorStop(1, 'rgba(255,220,180,0)');
    x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, big ? s / 2 : s * 0.3, s * (big ? 0.022 : 0.014), 0, 0, TAU); x.fill();
    x.restore();
  }
  x.drawImage(SPR.hot, s * 0.36, s * 0.36, s * 0.28, s * 0.28);
  return c;
})();

const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789{}()<>[]/;=+*#&|~?!:.';
const GC = 40;
function glyphAtlas(fill, glow) {
  const cols = 16, rows = Math.ceil(GLYPHS.length / cols);
  const c = mkCanvas(cols * GC, rows * GC), x = c.getContext('2d');
  x.font = '600 25px ' + MONO; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = glow; x.shadowBlur = 9; x.fillStyle = fill;
  for (let i = 0; i < GLYPHS.length; i++) {
    const gx = (i % cols) * GC + GC / 2, gy = Math.floor(i / cols) * GC + GC / 2 + 1;
    x.fillText(GLYPHS[i], gx, gy); x.fillText(GLYPHS[i], gx, gy);
  }
  return c;
}
const ATL = { gold: glyphAtlas('#fff0d8', 'rgba(255,160,80,1)'), green: glyphAtlas('#d2ffe0', 'rgba(50,255,130,1)') };
function glyph(c, atlas, idx, x, y, size, a) {
  if (a <= 0.004 || size < 0.5) return;
  const i = ((idx % GLYPHS.length) + GLYPHS.length) % GLYPHS.length;
  c.globalAlpha = a > 1 ? 1 : a;
  c.drawImage(atlas, (i % 16) * GC, Math.floor(i / 16) * GC, GC, GC, x - size / 2, y - size / 2, size, size);
}
function spr(c, img, x, y, size, a) {
  if (!(a > 0.004) || !(size > 0.5)) return;
  c.globalAlpha = a > 1 ? 1 : a;
  c.drawImage(img, x - size / 2, y - size / 2, size, size);
}

/* ============================================================
   WEBGL SKY (procedural sky / clouds / rift / ground)
   ============================================================ */
const FRAG = [
'#ifdef GL_FRAGMENT_PRECISION_HIGH',
'precision highp float;',
'#else',
'precision mediump float;',
'#endif',
'uniform vec2 uRes;',
'uniform float uTime, uFoc, uCor, uDark, uVort, uRift, uDawn, uLit, uBlastR, uWarm;',
'uniform vec3 uCP, uCR, uCU, uCF, uRiftP, uEnemy;',
'uniform vec4 uSum, uCirc, uBlast;',
'float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }',
'float vn(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);',
'  return mix(mix(h21(i), h21(i+vec2(1.0,0.0)), u.x), mix(h21(i+vec2(0.0,1.0)), h21(i+vec2(1.0,1.0)), u.x), u.y); }',
'const mat2 M2 = mat2(1.6, 1.2, -1.2, 1.6);',
'float fbm5(vec2 p){ float v = 0.0; float a = 0.5; for (int i = 0; i < 5; i++){ v += a*vn(p); p = M2*p + 17.3; a *= 0.5; } return v; }',
'float fbm3(vec2 p){ float v = 0.0; float a = 0.5; for (int i = 0; i < 3; i++){ v += a*vn(p); p = M2*p + 17.3; a *= 0.5; } return v; }',
'void main(){',
'  vec2 p = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;',
'  vec3 rd = normalize(uCF*uFoc + uCR*p.x + uCU*p.y);',
'  vec3 ro = uCP;',
'  float T = uTime;',
'  vec3 zen = mix(vec3(0.012,0.014,0.035), vec3(0.024,0.018,0.058), uCor);',
'  vec3 hor = mix(vec3(0.13,0.09,0.15), vec3(0.07,0.19,0.15), uCor);',
'  zen = mix(zen, vec3(0.07,0.11,0.26), uDawn);',
'  hor = mix(hor, vec3(1.0,0.58,0.34), uDawn);',
'  hor = mix(hor, vec3(0.50,0.26,0.13), uWarm*(1.0-uDawn));',
'  zen *= 1.0 - 0.7*uDark;',
'  hor *= 1.0 - 0.72*uDark;',
'  vec3 col;',
'  float el = rd.y;',
'  if (el >= 0.0) {',
'    float e = el;',
'    col = mix(hor, zen, pow(min(e*1.6, 1.0), 0.55));',
'    vec3 sd = rd * 230.0;',
'    vec3 cell = floor(sd);',
'    float hs = fract(sin(dot(cell, vec3(12.9898, 78.233, 37.719))) * 43758.5453);',
'    vec3 fp = fract(sd) - 0.5;',
'    float st = step(0.9972, hs) * (1.0 - smoothstep(0.0, 0.42, length(fp))) * (0.55 + 0.45*sin(T*2.3 + hs*400.0));',
'    col += vec3(0.85, 0.9, 1.0) * st * smoothstep(0.06, 0.35, e) * (1.0 - 0.9*uDawn);',
'    float tc = (40.0 - ro.y) / max(e, 0.004);',
'    vec2 q = ro.xz + rd.xz * tc;',
'    vec2 d = q - uRiftP.xz;',
'    float r = length(d);',
'    float ang = uVort * 3.2 * exp(-r/38.0) + T * (0.012 + 0.2*uVort*exp(-r/55.0));',
'    float cs = cos(ang); float sn = sin(ang);',
'    vec2 dq = vec2(cs*d.x - sn*d.y, sn*d.x + cs*d.y);',
'    vec2 cq = (uRiftP.xz + dq) * 0.032 + vec2(T*0.018, T*0.006);',
'    float n = fbm5(cq + 1.25*vec2(fbm3(cq*1.3 + T*0.035), fbm3(cq*1.3 - T*0.028 + 5.2)));',
'    float a = atan(d.y, d.x);',
'    n += uVort * 0.16 * sin(a*3.0 + log(r + 1.0)*4.0 - T*1.1) * exp(-r/90.0);',
'    float dens = smoothstep(0.40, 0.80, n) * smoothstep(0.0, 1.0, r / (0.5 + 20.0*uRift));',
'    vec3 cc = mix(vec3(0.045,0.038,0.07), vec3(0.045,0.105,0.08), uCor);',
'    cc = mix(cc, vec3(0.92,0.50,0.42), uDawn);',
'    cc *= mix(1.0, 0.42, uDark);',
'    cc *= 0.65 + 0.7*smoothstep(0.5, 0.95, n);',
'    cc += vec3(1.0, 0.56, 0.28) * uRift * exp(-r / (12.0 + 38.0*uRift)) * 1.7;',
'    cc += vec3(1.0, 0.62, 0.36) * uSum.w * 0.55 * exp(-length(q - uSum.xz) / 32.0);',
'    cc += vec3(0.72, 0.78, 1.0) * uLit * (0.35 + 0.9*n);',
'    float fade = exp(-tc / 300.0);',
'    col = mix(col, cc, dens * fade);',
'    float core = exp(-pow(r / (1.5 + 13.0*uRift), 2.0));',
'    vec3 rc = mix(vec3(1.0, 0.5, 0.22), vec3(1.0, 0.95, 0.86), core);',
'    float rays = 0.5 + 0.5*sin(a*13.0 + sin(a*4.0 + T*0.7)*2.0 + T*0.4);',
'    rays = pow(rays, 5.0) * exp(-r / (8.0 + 46.0*uRift));',
'    col += rc * uRift * (core*2.4 + rays*0.9*(1.0 - 0.6*dens)) * fade;',
'    float az = atan(rd.x, -rd.z);',
'    float mh = 0.012 + 0.055*fbm3(vec2(az*2.0, 3.1)) + 0.02*fbm3(vec2(az*7.0, 9.0));',
'    float mh2 = 0.006 + 0.032*fbm3(vec2(az*3.4 + 10.0, 1.0));',
'    vec3 mc = mix(hor*0.5 + zen*0.25, hor*0.8, 0.3);',
'    vec3 mc2 = mix(mc, vec3(0.012,0.010,0.016), 0.65);',
'    col = mix(col, mc, 1.0 - smoothstep(mh - 0.0015, mh + 0.0015, e));',
'    col = mix(col, mc2, 1.0 - smoothstep(mh2 - 0.0015, mh2 + 0.0015, e));',
'    col = mix(col, hor*0.9, (1.0 - smoothstep(0.0, 0.012, e))*0.5);',
'  } else {',
'    float tg = -ro.y / min(el, -0.0004);',
'    vec3 gp = ro + rd * tg;',
'    vec2 g = gp.xz;',
'    float n = fbm5(g*0.22);',
'    float n2 = vn(g*2.3);',
'    vec3 gc = mix(vec3(0.030,0.027,0.036), vec3(0.068,0.060,0.066), n) * (0.75 + 0.5*n2);',
'    float ed = length(g - uEnemy.xz);',
'    float vv = fbm3(g*0.55 + 4.0);',
'    float vein = 1.0 - smoothstep(0.0, 0.05, abs(vv - 0.5));',
'    gc += vec3(0.25, 1.0, 0.55) * vein * uCor * exp(-ed/7.5) * 0.5;',
'    gc = mix(gc, gc*vec3(2.7,1.95,1.5) + vec3(0.075,0.045,0.03), uDawn);',
'    gc *= mix(1.0, 0.5, uDark);',
'    vec3 L = vec3(0.0);',
'    vec3 ds = gp - uSum.xyz;',
'    L += vec3(1.0, 0.62, 0.36) * uSum.w * 20.0 / (1.0 + dot(ds, ds)*0.06);',
'    vec2 dc = g - uCirc.xz;',
'    L += vec3(1.0, 0.58, 0.32) * uCirc.w * 3.2 / (1.0 + dot(dc, dc)*1.4);',
'    vec2 db = g - uBlast.xz;',
'    L += vec3(1.0, 0.78, 0.5) * uBlast.w * 26.0 / (1.0 + dot(db, db) / (uBlastR*uBlastR + 0.5));',
'    L += vec3(0.72, 0.78, 1.0) * uLit * 0.5;',
'    gc = gc * (1.0 + L) + L * 0.012;',
'    float fog = 1.0 - exp(-tg / 32.0);',
'    col = mix(gc, hor*0.88, fog);',
'  }',
'  col = 1.0 - exp(-col * 1.3);',
'  col += (h21(gl_FragCoord.xy + fract(T*7.0)*91.0) - 0.5) / 255.0;',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

const gcv = mkCanvas(2, 2);
let gl = null, glU = null;
(function initGL() {
  try {
    gl = gcv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
    if (!gl) return;
    const mk = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    const vs = mk(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}');
    const fs = mk(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) { gl = null; return; }
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.bindAttribLocation(pr, 0, 'a'); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(pr)); gl = null; return; }
    gl.useProgram(pr);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    glU = {};
    ['uRes', 'uTime', 'uFoc', 'uCor', 'uDark', 'uVort', 'uRift', 'uDawn', 'uLit', 'uBlastR', 'uWarm',
     'uCP', 'uCR', 'uCU', 'uCF', 'uRiftP', 'uEnemy', 'uSum', 'uCirc', 'uBlast'].forEach(n => { glU[n] = gl.getUniformLocation(pr, n); });
    gcv.addEventListener('webglcontextlost', e => { e.preventDefault(); gl = null; });
  } catch (e) { console.warn(e); gl = null; }
})();

/* ============================================================
   TIMELINE + WORLD LAYOUT
   ============================================================ */
const TL = {
  msg1: [0.7, 2.5], turn: 2.6, cur: [2.8, 3.15, 3.5], conf1: 3.95, sub: 4.05, scur: [4.3, 4.7, 5.1], conf2: 5.55,
  close: 5.7, banner: [5.8, 7.0], step: [5.8, 6.4], raise: [6.2, 7.0], cut: 6.6, lbIn: [7.0, 7.8],
  circ: [7.5, 9.0], lines: [[8.6, 10.3], [10.4, 12.1], [12.2, 13.8]], thrust: 13.45, beamUp: [13.55, 14.7],
  bolts: [14.3, 14.95, 15.6, 16.35], rift: [14.2, 16.0], skyc: [15.0, 16.6], desc: [16.6, 18.0], arrive: 18.0,
  rays: 18.4, rayGap: 0.16, rings: [19.9, 21.0], manifest: 20.8, title: [21.2, 24.0], charge: [24.0, 28.4],
  words: [24.4, 25.6, 26.8], ultra: 28.0, launch0: 28.65, launchGap: 0.11, flight: 0.55,
  beam: 30.8, impact: 31.0, dissolve: [32.6, 35.6], lbOut: [35.0, 35.8],
  panelBack: 35.6, msg2: [35.9, 38.4], depart: [35.6, 37.3], victory: 37.6, results: 38.6, again: 40.6
};
const HY = [-5.0, 0, -0.8];
const ROOK = [4.9, 0, -1.35], VALE = [6.15, 0, 1.9], MIRA0 = [5.4, 0, 0.35], MIRA1 = [4.45, 0, 0.35];
const SPARK = [0, 8.6, -4];
const RIFT = [0, 40, -14];
const SPARK_R = 3.2;
const HIT = [HY[0] + 0.7, 2.3, HY[2]];

/* ---------- camera ---------- */
const cam = { p: [0, 2, 12], r: [1, 0, 0], u: [0, 1, 0], f: [0, 0, -1], foc: 1000, cx: 0, cy: 0 };
function setCam(px, py, pz, lx, ly, lz, fov, roll) {
  let fx = lx - px, fy = ly - py, fz = lz - pz;
  const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, rz = fx; const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
  const ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;
  const c = Math.cos(roll), s = Math.sin(roll);
  cam.r[0] = rx * c + ux * s; cam.r[1] = uy * s; cam.r[2] = rz * c + uz * s;
  cam.u[0] = ux * c - rx * s; cam.u[1] = uy * c; cam.u[2] = uz * c - rz * s;
  cam.p[0] = px; cam.p[1] = py; cam.p[2] = pz;
  cam.f[0] = fx; cam.f[1] = fy; cam.f[2] = fz;
  cam.foc = (VH * 0.5 * S) / Math.tan(fov * PI / 360);
  cam.cx = W / 2; cam.cy = H / 2;
}
function pt() { return { x: 0, y: 0, s: 0, z: 0, v: false }; }
const QA = pt(), QB = pt(), QC = pt(), QD = pt(), QE = pt();
function proj(x, y, z, o) {
  const dx = x - cam.p[0], dy = y - cam.p[1], dz = z - cam.p[2];
  const zc = dx * cam.f[0] + dy * cam.f[1] + dz * cam.f[2];
  o.z = zc;
  if (zc < 0.12) { o.v = false; return o; }
  const xc = dx * cam.r[0] + dy * cam.r[1] + dz * cam.r[2];
  const yc = dx * cam.u[0] + dy * cam.u[1] + dz * cam.u[2];
  const s = cam.foc / zc;
  o.x = cam.cx + xc * s; o.y = cam.cy - yc * s; o.s = s; o.v = true;
  return o;
}
/* billboard affine: local x = camera right (m), local y = down (m) */
const BBM = [1, 0, 0, 1, 0, 0];
function billboard(x, y, z) {
  const A = proj(x, y, z, QA); if (!A.v) return null;
  const e = 0.05;
  const B = proj(x + cam.r[0] * e, y + cam.r[1] * e, z + cam.r[2] * e, QB);
  const C = proj(x, y + e, z, QC);
  if (!B.v || !C.v) return null;
  BBM[0] = (B.x - A.x) / e; BBM[1] = (B.y - A.y) / e;
  BBM[2] = -(C.x - A.x) / e; BBM[3] = -(C.y - A.y) / e;
  BBM[4] = A.x; BBM[5] = A.y;
  BBM.s = A.s; BBM.z = A.z;
  return BBM;
}
function setBB(c, M, ox, oy) { c.setTransform(M[0], M[1], M[2], M[3], M[4] + (ox || 0), M[5] + (oy || 0)); }
